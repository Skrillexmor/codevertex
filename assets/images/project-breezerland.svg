<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="cyan-bl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="card-bl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38" />
      <stop offset="100%" stop-color="#0a1b22" />
    </linearGradient>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-bl)" rx="16" />
  <circle cx="680" cy="140" r="160" fill="#14b8a6" opacity="0.16" filter="url(#glow-teal)" />
  <circle cx="150" cy="400" r="150" fill="#06b6d4" opacity="0.15" filter="url(#glow-teal)" />

  <!-- Browser Window -->
  <g transform="translate(40, 40)">
    <rect width="720" height="420" rx="12" fill="#09181f" stroke="#164e63" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="720" height="42" rx="12" fill="#0f2631" />
    <rect y="30" width="720" height="12" fill="#0f2631" />
    <circle cx="25" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="65" cy="21" r="5.5" fill="#10b981" />
    <rect x="180" y="10" width="360" height="22" rx="6" fill="#061217" stroke="#164e63" stroke-width="1" />
    <text x="360" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔒 https://breezerland.in</text>

    <!-- Header -->
    <text x="40" y="76" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="url(#cyan-bl)">BREEZERLAND RESORT</text>
    <rect x="270" y="68" width="50" height="10" rx="2" fill="#64748b" />
    <rect x="335" y="68" width="55" height="10" rx="2" fill="#64748b" />
    <rect x="405" y="68" width="60" height="10" rx="2" fill="#64748b" />
    
    <rect x="585" y="60" width="105" height="24" rx="12" fill="url(#cyan-bl)" />
    <text x="637" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#09181f" text-anchor="middle">BOOK STAY</text>

    <!-- Hero Banner with Resort Landscape Art -->
    <rect x="25" y="98" width="670" height="150" rx="8" fill="url(#card-bl)" stroke="#155e75" stroke-width="1" />
    
    <!-- Palm trees & Sun graphic -->
    <circle cx="560" cy="150" r="40" fill="#fbbf24" opacity="0.8" />
    <path d="M 460,248 Q 500,160 550,248" fill="#042f2e" />
    <path d="M 520,248 Q 580,140 640,248" fill="#064e3b" />
    <path d="M 580,248 Q 630,170 680,248" fill="#0f766e" />

    <!-- Hero content -->
    <rect x="50" y="118" width="100" height="20" rx="10" fill="#065f46" />
    <text x="100" y="132" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">🌴 NATURE &amp; LUXURY</text>
    <text x="50" y="165" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Escape to Pure Paradise</text>
    <text x="50" y="188" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Premium cottages, thrilling water activities &amp; serene tranquil retreats.</text>

    <!-- Quick Booking Bar -->
    <rect x="50" y="205" width="380" height="30" rx="6" fill="#082f3b" stroke="#164e63" stroke-width="1" />
    <text x="70" y="224" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">📅 Check-In: Select Dates</text>
    <rect x="320" y="210" width="100" height="20" rx="4" fill="url(#cyan-bl)" />
    <text x="370" y="224" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#042f2e" text-anchor="middle">Check Availability</text>

    <!-- Amenity Cards -->
    <rect x="25" y="260" width="210" height="135" rx="8" fill="url(#card-bl)" stroke="#155e75" stroke-width="1" />
    <circle cx="50" cy="285" r="14" fill="#0d9488" opacity="0.3" />
    <text x="50" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#2dd4bf" text-anchor="middle">🏊</text>
    <text x="75" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Infinity Pool &amp; Park</text>
    <text x="35" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Massive water leisure zone with world-class wave slides.</text>
    <rect x="35" y="350" width="70" height="6" rx="2" fill="#0d9488" />

    <rect x="255" y="260" width="210" height="135" rx="8" fill="url(#card-bl)" stroke="#155e75" stroke-width="1" />
    <circle cx="280" cy="285" r="14" fill="#0d9488" opacity="0.3" />
    <text x="280" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#2dd4bf" text-anchor="middle">🏡</text>
    <text x="305" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Luxury Eco Villas</text>
    <text x="265" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Surrounded by organic green orchards &amp; private garden decks.</text>
    <rect x="265" y="350" width="85" height="6" rx="2" fill="#0d9488" />

    <rect x="485" y="260" width="210" height="135" rx="8" fill="url(#card-bl)" stroke="#155e75" stroke-width="1" />
    <circle cx="510" cy="285" r="14" fill="#0d9488" opacity="0.3" />
    <text x="510" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#2dd4bf" text-anchor="middle">🍽️</text>
    <text x="535" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Multi-Cuisine Dining</text>
    <text x="495" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Authentic farm-to-table delicacies served under starlit skies.</text>
    <rect x="495" y="350" width="65" height="6" rx="2" fill="#0d9488" />
  </g>
</svg>
