<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-cv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d1e" />
      <stop offset="100%" stop-color="#031633" />
    </linearGradient>
    <linearGradient id="blue-cv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="card-cv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#040b18" />
    </linearGradient>
    <filter id="glow-cv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-cv)" rx="16" />
  <circle cx="680" cy="110" r="180" fill="#0066ff" opacity="0.25" filter="url(#glow-cv)" />
  <circle cx="140" cy="410" r="160" fill="#00d2ff" opacity="0.18" filter="url(#glow-cv)" />

  <!-- Browser Window -->
  <g transform="translate(40, 40)">
    <rect width="720" height="420" rx="12" fill="#040813" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="720" height="42" rx="12" fill="#0b1329" />
    <rect y="30" width="720" height="12" fill="#0b1329" />
    <circle cx="25" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="65" cy="21" r="5.5" fill="#10b981" />
    <rect x="180" y="10" width="360" height="22" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <text x="360" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔒 https://codevertex.dev/innovations</text>

    <!-- Header -->
    <text x="40" y="76" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="url(#blue-cv)" letter-spacing="1">CODEVERTEX INNOVATION LAB</text>
    <rect x="360" y="68" width="50" height="10" rx="2" fill="#475569" />
    <rect x="425" y="68" width="55" height="10" rx="2" fill="#475569" />
    <rect x="495" y="68" width="60" height="10" rx="2" fill="#475569" />
    
    <rect x="590" y="60" width="100" height="24" rx="12" fill="url(#blue-cv)" />
    <text x="640" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#030712" text-anchor="middle">EXPLORE</text>

    <!-- Main 3D Wireframe / Code Visual -->
    <rect x="25" y="98" width="670" height="145" rx="8" fill="url(#card-cv)" stroke="#1d4ed8" stroke-width="1" />
    
    <!-- Code block simulation on left -->
    <rect x="45" y="115" width="280" height="110" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <text x="55" y="132" font-family="'Fira Code', monospace" font-size="9" fill="#38bdf8">const <tspan fill="#f472b6">experience</tspan> = new <tspan fill="#fbbf24">NextGenApp</tspan>({</text>
    <text x="65" y="148" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">  speedScore: <tspan fill="#34d399">99.8</tspan>,</text>
    <text x="65" y="164" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">  architecture: <tspan fill="#60a5fa">"Modern Micro-Frontend"</tspan>,</text>
    <text x="65" y="180" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">  animations: <tspan fill="#fbbf24">"60fps GPU Accelerated"</tspan>,</text>
    <text x="65" y="196" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">  conversionBoost: <tspan fill="#34d399">"+340%"</tspan></text>
    <text x="55" y="212" font-family="'Fira Code', monospace" font-size="9" fill="#38bdf8">});</text>

    <!-- Right Side Hero Highlight -->
    <text x="350" y="135" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ BESPOKE DIGITAL ENGINEERING</text>
    <text x="350" y="165" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Scalable Cloud &amp; Web Architectures</text>
    <text x="350" y="188" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">High-performance full-stack web applications engineered for speed &amp; maximum conversion.</text>

    <!-- 3 Metrics feature cards -->
    <rect x="25" y="258" width="210" height="135" rx="8" fill="url(#card-cv)" stroke="#1e293b" stroke-width="1" />
    <circle cx="50" cy="285" r="14" fill="#0284c7" opacity="0.3" />
    <text x="50" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">🚀</text>
    <text x="75" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Lighthouse 99+</text>
    <text x="35" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Sub-second load times, instant cache &amp; perfect SEO optimization.</text>
    <rect x="35" y="355" width="80" height="6" rx="2" fill="#00d2ff" />

    <rect x="255" y="258" width="210" height="135" rx="8" fill="url(#card-cv)" stroke="#1e293b" stroke-width="1" />
    <circle cx="280" cy="285" r="14" fill="#6366f1" opacity="0.3" />
    <text x="280" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">🎨</text>
    <text x="305" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Adaptive UI / UX</text>
    <text x="265" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Tailored interactive interfaces crafted to capture customer attention.</text>
    <rect x="265" y="355" width="95" height="6" rx="2" fill="#818cf8" />

    <rect x="485" y="258" width="210" height="135" rx="8" fill="url(#card-cv)" stroke="#1e293b" stroke-width="1" />
    <circle cx="510" cy="285" r="14" fill="#10b981" opacity="0.3" />
    <text x="510" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#34d399" text-anchor="middle">🔒</text>
    <text x="535" y="290" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Enterprise Security</text>
    <text x="495" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Built with secure authentication, API protection &amp; robust data layers.</text>
    <rect x="495" y="355" width="75" height="6" rx="2" fill="#34d399" />
  </g>
</svg>
