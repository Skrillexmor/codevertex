      <text x="425" y="252" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Vortex Tech</text>
      <text x="425" y="264" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">$82,000 • Won</text>

