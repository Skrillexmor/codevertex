<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-mj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106" />
      <stop offset="50%" stop-color="#0f0c08" />
      <stop offset="100%" stop-color="#241407" />
    </linearGradient>
    <linearGradient id="gold-mj" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c07b" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="card-mj" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b11" />
      <stop offset="100%" stop-color="#140e09" />
    </linearGradient>
    <filter id="glow-gold2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-mj)" rx="16" />
  <circle cx="680" cy="120" r="160" fill="#f59e0b" opacity="0.14" filter="url(#glow-gold2)" />
  <circle cx="140" cy="380" r="140" fill="#fbbf24" opacity="0.12" filter="url(#glow-gold2)" />

  <!-- Browser Window -->
  <g transform="translate(40, 40)">
    <rect width="720" height="420" rx="12" fill="#0d0a07" stroke="#3d2c18" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="720" height="42" rx="12" fill="#1c140d" />
    <rect y="30" width="720" height="12" fill="#1c140d" />
    <circle cx="25" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="65" cy="21" r="5.5" fill="#10b981" />
    <rect x="180" y="10" width="360" height="22" rx="6" fill="#0b0805" stroke="#3d2c18" stroke-width="1" />
    <text x="360" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔒 https://madhavjewels.co.in</text>

    <!-- Header -->
    <text x="40" y="76" font-family="'Outfit', serif" font-weight="800" font-size="16" fill="url(#gold-mj)" letter-spacing="1.5">MADHAV JEWELS</text>
    <rect x="250" y="68" width="55" height="10" rx="2" fill="#78614a" />
    <rect x="320" y="68" width="60" height="10" rx="2" fill="#78614a" />
    <rect x="395" y="68" width="50" height="10" rx="2" fill="#78614a" />
    
    <rect x="580" y="60" width="110" height="24" rx="12" fill="url(#gold-mj)" />
    <text x="635" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#1c1106" text-anchor="middle">VIEW CATALOGUE</text>

    <!-- Hero Showcase Section -->
    <rect x="25" y="98" width="670" height="135" rx="8" fill="url(#card-mj)" stroke="#4a361e" stroke-width="1" />
    
    <g transform="translate(520, 115)">
      <!-- Diamond Gem Silhouette -->
      <polygon points="60,10 90,35 60,85 30,35" fill="none" stroke="url(#gold-mj)" stroke-width="2" />
      <polygon points="45,35 75,35 60,85" fill="#f59e0b" opacity="0.3" stroke="url(#gold-mj)" stroke-width="1" />
      <polygon points="60,10 45,35 75,35" fill="#ffd700" opacity="0.4" stroke="url(#gold-mj)" stroke-width="1" />
      <polygon points="60,10 30,35 45,35" fill="#d97706" opacity="0.3" stroke="url(#gold-mj)" stroke-width="1" />
      <polygon points="60,10 90,35 75,35" fill="#d97706" opacity="0.3" stroke="url(#gold-mj)" stroke-width="1" />
      <circle cx="60" cy="45" r="45" fill="#ffd700" opacity="0.1" filter="url(#glow-gold2)" />
    </g>

    <text x="50" y="135" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="2">AUTHENTIC GOLD &amp; DIAMOND HERITAGE</text>
    <text x="50" y="168" font-family="'Outfit', serif" font-size="22" font-weight="800" fill="#ffffff">Timeless Craftsmanship</text>
    <text x="50" y="192" font-family="'Inter', sans-serif" font-size="11" fill="#a89a8c">Bespoke bridal collections, certified solitaire rings &amp; luxury ornaments.</text>

    <!-- 3 Category Cards -->
    <rect x="25" y="248" width="210" height="148" rx="8" fill="url(#card-mj)" stroke="#3d2c18" stroke-width="1" />
    <rect x="35" y="258" width="190" height="75" rx="6" fill="#1c130b" />
    <circle cx="130" cy="295" r="22" fill="none" stroke="url(#gold-mj)" stroke-width="2.5" />
    <circle cx="130" cy="275" r="5" fill="#fbbf24" />
    <text x="35" y="352" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Bridal Polki &amp; Kundan</text>
    <text x="35" y="370" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37">Exclusive Handcrafted Heritage</text>

    <rect x="255" y="248" width="210" height="148" rx="8" fill="url(#card-mj)" stroke="#3d2c18" stroke-width="1" />
    <rect x="265" y="258" width="190" height="75" rx="6" fill="#1c130b" />
    <!-- Solitaire ring -->
    <ellipse cx="360" cy="300" rx="20" ry="12" fill="none" stroke="url(#gold-mj)" stroke-width="2.5" />
    <polygon points="360,282 353,290 367,290" fill="#ffffff" />
    <text x="265" y="352" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Certified Solitaire Rings</text>
    <text x="265" y="370" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37">VVS Clarity Certified Gems</text>

    <rect x="485" y="248" width="210" height="148" rx="8" fill="url(#card-mj)" stroke="#3d2c18" stroke-width="1" />
    <rect x="495" y="258" width="190" height="75" rx="6" fill="#1c130b" />
    <!-- Necklace icon -->
    <path d="M 570,280 Q 590,310 610,280" fill="none" stroke="url(#gold-mj)" stroke-width="2.5" />
    <circle cx="590" cy="300" r="4" fill="#fbbf24" />
    <text x="495" y="352" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Royal Gold Sets</text>
    <text x="495" y="370" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37">22K &amp; 18K Hallmarked Purity</text>
  </g>
</svg>
