<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-kp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#12131c" />
      <stop offset="100%" stop-color="#1f1828" />
    </linearGradient>
    <linearGradient id="gold-kp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="card-kp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171822" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-kp)" rx="16" />
  <circle cx="680" cy="100" r="170" fill="#d4af37" opacity="0.12" filter="url(#glow-gold)" />
  <circle cx="120" cy="420" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow-gold)" />

  <!-- Browser Window -->
  <g transform="translate(40, 40)">
    <rect width="720" height="420" rx="12" fill="#0c0d14" stroke="#2a2c3d" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="720" height="42" rx="12" fill="#141522" />
    <rect y="30" width="720" height="12" fill="#141522" />
    <circle cx="25" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="65" cy="21" r="5.5" fill="#10b981" />
    <rect x="180" y="10" width="360" height="22" rx="6" fill="#090a0f" stroke="#2a2c3d" stroke-width="1" />
    <text x="360" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔒 https://king-perfumes.vercel.app</text>

    <!-- Header / Navbar -->
    <text x="40" y="76" font-family="'Outfit', 'Cinzel', serif" font-weight="800" font-size="16" fill="url(#gold-kp)" letter-spacing="2">KING PERFUMES</text>
    <rect x="240" y="68" width="50" height="10" rx="2" fill="#64748b" />
    <rect x="310" y="68" width="60" height="10" rx="2" fill="#64748b" />
    <rect x="390" y="68" width="55" height="10" rx="2" fill="#64748b" />
    
    <rect x="600" y="60" width="85" height="24" rx="12" fill="url(#gold-kp)" />
    <text x="642" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">SHOP NOW</text>

    <!-- Hero Banner -->
    <rect x="25" y="98" width="670" height="120" rx="8" fill="url(#card-kp)" stroke="#3a2f1d" stroke-width="1" />
    <!-- Ambient Gold glow inside hero -->
    <circle cx="560" cy="158" r="70" fill="#d4af37" opacity="0.15" filter="url(#glow-gold)" />
    
    <!-- Hero Text -->
    <text x="50" y="132" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#d4af37" letter-spacing="1.5">ROYAL LUXURY COLLECTION</text>
    <text x="50" y="162" font-family="'Outfit', serif" font-size="20" font-weight="800" fill="#ffffff">Elegance In Every Drop</text>
    <text x="50" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Discover artisanal fragrances crafted with pure exotic essences.</text>

    <!-- Perfume Bottle Graphic Silhouette -->
    <g transform="translate(560, 115)">
      <!-- Cap -->
      <rect x="20" y="5" width="20" height="15" rx="3" fill="url(#gold-kp)" />
      <!-- Neck -->
      <rect x="25" y="20" width="10" height="6" fill="#64748b" />
      <!-- Body -->
      <rect x="5" y="26" width="50" height="55" rx="8" fill="#1e1b2e" stroke="url(#gold-kp)" stroke-width="1.5" />
      <rect x="15" y="42" width="30" height="20" rx="2" fill="#000" stroke="#d4af37" stroke-width="0.8" />
      <text x="30" y="55" font-family="'Inter', sans-serif" font-size="6" font-weight="800" fill="#d4af37" text-anchor="middle">OUD</text>
    </g>

    <!-- Product Grid (3 Cards) -->
    <!-- Card 1 -->
    <rect x="25" y="232" width="210" height="165" rx="8" fill="url(#card-kp)" stroke="#27293d" stroke-width="1" />
    <rect x="35" y="242" width="190" height="85" rx="6" fill="#13141f" />
    <circle cx="130" cy="284" r="28" fill="#d4af37" opacity="0.1" />
    <rect x="123" y="262" width="14" height="10" rx="2" fill="url(#gold-kp)" />
    <rect x="115" y="272" width="30" height="36" rx="4" fill="#1e1b2e" stroke="url(#gold-kp)" stroke-width="1" />
    <text x="35" y="345" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Oud Royal Noir</text>
    <text x="35" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37" font-weight="700">₹2,499</text>
    <rect x="175" y="350" width="50" height="18" rx="4" fill="url(#gold-kp)" />
    <text x="200" y="363" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#000" text-anchor="middle">+ Cart</text>

    <!-- Card 2 -->
    <rect x="255" y="232" width="210" height="165" rx="8" fill="url(#card-kp)" stroke="#27293d" stroke-width="1" />
    <rect x="265" y="242" width="190" height="85" rx="6" fill="#13141f" />
    <circle cx="360" cy="284" r="28" fill="#a855f7" opacity="0.15" />
    <rect x="353" y="262" width="14" height="10" rx="2" fill="url(#gold-kp)" />
    <rect x="345" y="272" width="30" height="36" rx="4" fill="#241738" stroke="#a855f7" stroke-width="1" />
    <text x="265" y="345" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Amber Velvet Supreme</text>
    <text x="265" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37" font-weight="700">₹3,199</text>
    <rect x="405" y="350" width="50" height="18" rx="4" fill="url(#gold-kp)" />
    <text x="430" y="363" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#000" text-anchor="middle">+ Cart</text>

    <!-- Card 3 -->
    <rect x="485" y="232" width="210" height="165" rx="8" fill="url(#card-kp)" stroke="#27293d" stroke-width="1" />
    <rect x="495" y="242" width="190" height="85" rx="6" fill="#13141f" />
    <circle cx="590" cy="284" r="28" fill="#06b6d4" opacity="0.15" />
    <rect x="583" y="262" width="14" height="10" rx="2" fill="url(#gold-kp)" />
    <rect x="575" y="272" width="30" height="36" rx="4" fill="#0f2638" stroke="#06b6d4" stroke-width="1" />
    <text x="495" y="345" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Aqua Imperiale</text>
    <text x="495" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37" font-weight="700">₹1,999</text>
    <rect x="635" y="350" width="50" height="18" rx="4" fill="url(#gold-kp)" />
    <text x="660" y="363" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#000" text-anchor="middle">+ Cart</text>
  </g>
</svg>
